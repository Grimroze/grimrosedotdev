<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#glow)" />
  
  <!-- Neural Mesh Grid -->
  <g stroke="rgba(56, 189, 248, 0.18)" stroke-width="1" fill="none">
    <path d="M-20,260 Q100,160 220,210 T420,120" />
    <path d="M-20,220 Q120,140 240,180 T420,80" />
    <path d="M-20,290 Q80,210 200,240 T420,170" />
    <path d="M40,-20 Q120,120 180,280" />
    <path d="M160,-20 Q220,140 280,310" />
    <path d="M280,-20 Q320,110 380,300" />
  </g>

  <!-- Speculative Nodes -->
  <circle cx="140" cy="110" r="4" fill="#38bdf8" filter="drop-shadow(0 0 8px #38bdf8)" />
  <circle cx="260" cy="160" r="5" fill="#a855f7" filter="drop-shadow(0 0 10px #a855f7)" />
  <circle cx="210" cy="70" r="3" fill="#ffffff" filter="drop-shadow(0 0 6px #ffffff)" />
  <circle cx="90" cy="180" r="3.5" fill="#38bdf8" />
  <line x1="140" y1="110" x2="260" y2="160" stroke="url(#cyber)" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="140" y1="110" x2="210" y2="70" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
  <line x1="90" y1="180" x2="140" y2="110" stroke="#38bdf8" stroke-width="1.2" opacity="0.5" />

  <!-- Digital Audio Frequency Wave -->
  <path d="M20,250 L60,250 L75,225 L90,265 L105,210 L120,280 L135,230 L150,250 L200,250 L215,220 L230,270 L245,240 L260,250 L380,250" 
        stroke="url(#cyber)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
</svg>
