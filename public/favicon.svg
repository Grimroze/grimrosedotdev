<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Dark Mode Gradient: Bright Specular White fading into Electric Sky Blue -->
    <linearGradient id="omegaDark" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Light Mode Gradient: Obsidian Ink fading into Deep Electric Indigo -->
    <linearGradient id="omegaLight" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="60%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <style>
    .omega-glyph {
      stroke: url(#omegaDark);
    }
    @media (prefers-color-scheme: light) {
      .omega-glyph {
        stroke: url(#omegaLight);
      }
    }
  </style>

  <!-- Razor-sharp, high-contrast, luxury sculpted Omega (Ω) glyph -->
  <!-- Designed specifically for 16x16 and 32x32 browser tab pixel density -->
  <path
    class="omega-glyph"
    d="M 6 52 L 19 52 C 23.5 52 25.5 45 23 39 C 17.5 28 20 11 32 11 C 44 11 46.5 28 41 39 C 38.5 45 40.5 52 45 52 L 58 52"
    fill="none"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
