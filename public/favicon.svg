<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Obsidian Luxury -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181f" />
      <stop offset="50%" stop-color="#0c0c10" />
      <stop offset="100%" stop-color="#030305" />
    </linearGradient>

    <!-- Chrome & Specular Highlight Gradient for Omega -->
    <linearGradient id="omegaGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e0e7ff" />
      <stop offset="50%" stop-color="#93c5fd" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Outer Rim Accent -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)" />
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.35)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.25)" />
    </linearGradient>

    <!-- Ambient Core Glow Behind Omega -->
    <radialGradient id="coreGlow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.25)" />
      <stop offset="55%" stop-color="rgba(168, 85, 247, 0.10)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Precision Bevel Rim -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="120" fill="none" stroke="url(#rimGrad)" stroke-width="4.5" />
  
  <!-- Ambient Core Glow -->
  <circle cx="256" cy="225" r="170" fill="url(#coreGlow)" />

  <!-- Iconic Classical Omega (Ω) Glyph -->
  <g filter="url(#glow)">
    <path 
      d="M 96 368 
         L 182 368 
         C 192 368 200 348 190 326 
         C 152 284 140 220 162 160 
         C 188 92 250 72 298 90 
         C 342 108 368 156 364 214 
         C 360 266 332 308 322 326 
         C 312 348 320 368 330 368 
         L 416 368" 
      fill="none" 
      stroke="url(#omegaGrad)" 
      stroke-width="42" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
  </g>

  <!-- Central Specular Starlight Spark -->
  <circle cx="256" cy="225" r="7" fill="#ffffff" />
  <circle cx="256" cy="225" r="14" fill="none" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2" />
</svg>